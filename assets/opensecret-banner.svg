<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1026">
        <animate attributeName="stop-color" values="#0B1026;#172554;#0F172A;#0B1026" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.36" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#22C55E;#F97316;#0EA5E9" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.72" stop-color="#F43F5E">
        <animate attributeName="stop-color" values="#F43F5E;#8B5CF6;#06B6D4;#F43F5E" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#EC4899;#84CC16;#F59E0B" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="260" y1="285" x2="940" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3D0"/>
      <stop offset="0.5" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <filter id="soft" x="-40" y="-40" width="1280" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <g opacity="0.55" filter="url(#soft)">
    <circle cx="180" cy="72" r="76" fill="#22C55E">
      <animate attributeName="cy" values="72;112;72" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="96" r="86" fill="#F97316">
      <animate attributeName="cy" values="96;54;96" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="340" r="104" fill="#EC4899">
      <animate attributeName="cx" values="870;930;870" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="84" y="132" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800">OpenSecret</text>
  <text x="88" y="174" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">one transfer id, one real file, one clean local API</text>
  <rect x="84" y="226" width="248" height="104" rx="18" fill="#07111F" fill-opacity="0.76" stroke="#67E8F9" stroke-width="2"/>
  <text x="116" y="264" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">RECEIVER</text>
  <text x="116" y="296" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">creates session</text>
  <text x="116" y="320" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">POST /transfer/receive</text>
  <rect x="438" y="216" width="324" height="124" rx="20" fill="#111827" fill-opacity="0.82" stroke="#FDE68A" stroke-width="2"/>
  <text x="490" y="258" fill="#FDE68A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">TRANSFER SESSION</text>
  <text x="490" y="294" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">status, file name, size</text>
  <text x="490" y="320" fill="#FEF3C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">stored in received_files/&lt;id&gt;</text>
  <rect x="866" y="226" width="250" height="104" rx="18" fill="#190B1B" fill-opacity="0.76" stroke="#F9A8D4" stroke-width="2"/>
  <text x="900" y="264" fill="#F9A8D4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">SENDER</text>
  <text x="900" y="296" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">uploads file</text>
  <text x="900" y="320" fill="#FCE7F3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">POST /transfer/send/:id</text>
  <path id="route" d="M334 278 C388 244 404 244 438 278 C788 334 806 334 866 278" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <circle r="10" fill="#FFFFFF">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M334 278 C388 244 404 244 438 278 C788 334 806 334 866 278"/>
  </circle>
  <circle r="6" fill="#A7F3D0">
    <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M334 278 C388 244 404 244 438 278 C788 334 806 334 866 278"/>
  </circle>
  <text x="84" y="382" fill="#FFFFFF" fill-opacity="0.86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Gin API • multipart upload • per-transfer storage • receiver download route</text>
</svg>
